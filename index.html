<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Братан — угарный ИИ</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>😎</text></svg>">
<style>
  :root{
    --bg:#0b0b10; --text:#f2f3f7; --muted:#8e93a3; --line:rgba(255,255,255,.08);
    --glass:rgba(22,22,30,.62); --bot:rgba(32,33,44,.86);
    --o1:#ff4d1f; --o2:#ff9a3c; --p1:#8b5cf6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--text);overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}

  /* фон: светящиеся пятна + точечная сетка */
  .bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  .blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;animation:float 18s ease-in-out infinite alternate}
  .b1{width:340px;height:340px;background:var(--o1);top:-120px;right:-120px}
  .b2{width:300px;height:300px;background:var(--p1);bottom:60px;left:-150px;opacity:.35;animation-duration:22s}
  .b3{width:200px;height:200px;background:var(--o2);bottom:-80px;right:-40px;opacity:.25;animation-duration:26s}
  .dots{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1px);background-size:22px 22px;
    mask-image:linear-gradient(to bottom,#000 0%,transparent 90%);-webkit-mask-image:linear-gradient(to bottom,#000 0%,transparent 90%)}
  @keyframes float{to{transform:translate(-40px,50px) scale(1.12)}}

  .app{position:relative;z-index:1;height:100dvh;max-width:560px;margin:0 auto;display:flex;flex-direction:column}

  /* шапка */
  header{display:flex;align-items:center;gap:12px;margin:10px 10px 0;margin-top:max(10px,env(safe-area-inset-top));
    padding:10px 12px;border-radius:22px;background:var(--glass);border:1px solid var(--line);
    backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);
    box-shadow:0 10px 30px rgba(0,0,0,.35)}
  .ava{position:relative;width:46px;height:46px;flex:none}
  .ava .ring{position:absolute;inset:-3px;border-radius:50%;
    background:conic-gradient(from 0deg,var(--o1),var(--o2),var(--p1),var(--o1));animation:spin 4s linear infinite}
  .ava .face{position:absolute;inset:0;border-radius:50%;display:grid;place-items:center;font-size:24px;
    background:linear-gradient(145deg,#2a1a14,#1a1420);border:2px solid var(--bg)}
  .ava .on{position:absolute;right:-1px;bottom:-1px;width:13px;height:13px;border-radius:50%;background:#22c55e;border:2.5px solid #16161e}
  @keyframes spin{to{transform:rotate(360deg)}}
  .who{flex:1;min-width:0}
  .who b{display:block;font-size:17px;letter-spacing:.2px}
  .who span{font-size:12.5px;color:#4ade80;transition:color .2s}
  .who span.typing{color:var(--o2)}
  .iconbtn{width:40px;height:40px;display:grid;place-items:center;border:0;border-radius:14px;cursor:pointer;
    background:rgba(255,255,255,.06);color:var(--muted)}
  .iconbtn:active{background:rgba(255,255,255,.14)}
  .iconbtn svg{width:19px;height:19px}

  /* чат */
  #chat{flex:1;overflow-y:auto;padding:18px 12px 10px;display:flex;flex-direction:column;gap:4px;scroll-behavior:smooth;
    overscroll-behavior:contain}
  #chat::-webkit-scrollbar{width:0}
  .row{display:flex;align-items:flex-end;gap:8px;animation:pop .22s cubic-bezier(.2,.9,.3,1.2)}
  .row.me{justify-content:flex-end}
  .row + .row.me, .row + .row.bot{margin-top:2px}
  .row.me + .row.bot, .row.bot + .row.me{margin-top:12px}
  .mini{width:28px;height:28px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:15px;
    background:linear-gradient(145deg,var(--o1),var(--o2))}
  .mini.hide{visibility:hidden}
  .msg{max-width:78%;padding:9px 13px 6px;border-radius:20px;font-size:15.5px;line-height:1.4;white-space:pre-wrap;word-wrap:break-word}
  .me .msg{background:linear-gradient(135deg,var(--o1),var(--o2));color:#fff;border-bottom-right-radius:6px;
    box-shadow:0 6px 20px rgba(255,90,31,.28)}
  .bot .msg{background:var(--bot);border:1px solid var(--line);border-bottom-left-radius:6px;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  .time{display:block;text-align:right;font-size:10.5px;margin-top:3px;opacity:.55}
  .err{align-self:center;margin:8px 0;padding:8px 14px;border-radius:14px;font-size:13.5px;
    background:rgba(239,68,68,.15);color:#fca5a5;border:1px solid rgba(239,68,68,.3)}
  .dots3{display:inline-flex;gap:4px;padding:6px 2px 4px}
  .dots3 i{width:7px;height:7px;border-radius:50%;background:var(--o2);animation:bounce 1.1s infinite}
  .dots3 i:nth-child(2){animation-delay:.15s}.dots3 i:nth-child(3){animation-delay:.3s}
  @keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-5px);opacity:1}}
  @keyframes pop{from{transform:translateY(10px) scale(.96);opacity:0}to{transform:none;opacity:1}}

  /* стартовый экран */
  .hero{margin:auto 0;padding:10px 6px 20px;text-align:center;animation:pop .4s ease-out}
  .hero .big{width:96px;height:96px;margin:0 auto 14px;position:relative}
  .hero .big .ring{position:absolute;inset:-4px;border-radius:50%;
    background:conic-gradient(from 0deg,var(--o1),var(--o2),var(--p1),var(--o1));animation:spin 5s linear infinite;
    box-shadow:0 0 40px rgba(255,90,31,.45)}
  .hero .big .face{position:absolute;inset:0;border-radius:50%;display:grid;place-items:center;font-size:50px;
    background:linear-gradient(145deg,#2a1a14,#1a1420);border:3px solid var(--bg)}
  .hero h1{font-size:30px;font-weight:800;letter-spacing:-.5px;
    background:linear-gradient(90deg,#fff,var(--o2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .hero p{color:var(--muted);font-size:14.5px;margin:6px auto 20px;max-width:290px;line-height:1.45}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:left}
  .card{padding:13px 13px 12px;border-radius:18px;cursor:pointer;border:1px solid var(--line);
    background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:var(--text);font:inherit;
    transition:transform .12s, border-color .12s}
  .card:active{transform:scale(.97);border-color:rgba(255,154,60,.6)}
  .card .e{font-size:22px;display:block;margin-bottom:6px}
  .card b{display:block;font-size:14px}
  .card small{color:var(--muted);font-size:12px}

  /* ввод */
  .bar{margin:0 10px 10px;margin-bottom:max(10px,env(safe-area-inset-bottom));display:flex;gap:8px;align-items:flex-end;
    padding:6px;border-radius:26px;background:var(--glass);border:1px solid var(--line);
    backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);box-shadow:0 10px 30px rgba(0,0,0,.35);
    transition:border-color .2s}
  .bar:focus-within{border-color:rgba(255,120,50,.45)}
  textarea{flex:1;resize:none;max-height:120px;background:transparent;color:var(--text);border:0;outline:none;
    padding:10px 12px;font:inherit;font-size:16px;line-height:1.35}
  textarea::placeholder{color:#6b7080}
  .send{width:44px;height:44px;flex:none;border:0;border-radius:50%;cursor:pointer;display:grid;place-items:center;
    background:linear-gradient(135deg,var(--o1),var(--o2));box-shadow:0 4px 16px rgba(255,90,31,.45);transition:transform .12s,opacity .2s}
  .send:active{transform:scale(.9)}
  .send:disabled{opacity:.45;box-shadow:none}
  .send svg{width:20px;height:20px;margin-left:2px}
</style>
</head>
<body>
<div class="bg"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="dots"></div></div>

<div class="app">
  <header>
    <div class="ava"><div class="ring"></div><div class="face">😎</div><div class="on"></div></div>
    <div class="who"><b>Братан</b><span id="status">в сети, готов стебать</span></div>
    <button class="iconbtn" id="clear" title="Новый чат" aria-label="Новый чат">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v6M14 11v6"/></svg>
    </button>
  </header>

  <div id="chat"></div>

  <form class="bar" id="form">
    <textarea id="input" rows="1" placeholder="Напиши чё-нибудь…"></textarea>
    <button class="send" id="send" type="submit" aria-label="Отправить">
      <svg viewBox="0 0 24 24" fill="#fff"><path d="M3.4 20.4 21 12 3.4 3.6l-.01 6.53L15 12 3.39 13.87z"/></svg>
    </button>
  </form>
</div>

<script>
// адрес воркера (прокладка к Groq)
const WORKER_URL = "https://ugar.akentevtut.workers.dev";

const chat = document.getElementById("chat");
const input = document.getElementById("input");
const form = document.getElementById("form");
const sendBtn = document.getElementById("send");
const statusEl = document.getElementById("status");

const SUGGEST = [
  ["😈","Подъеби меня","если не ссышь"],
  ["🤣","Расскажи анекдот","свежий, не баян"],
  ["🥱","Чё делать, скучно","спасай, братан"],
  ["🧠","Оцени мою жизнь","честно и жёстко"],
];

let history = [];
try { history = JSON.parse(localStorage.getItem("bratan_history") || "[]"); } catch {}
function save(){ try{ localStorage.setItem("bratan_history", JSON.stringify(history.slice(-40))); }catch{} }

const hhmm = ts => { const d = new Date(ts || Date.now()); return d.getHours().toString().padStart(2,"0")+":"+d.getMinutes().toString().padStart(2,"0"); };

function addRow(role, text, ts){
  const me = role === "user";
  const prev = chat.lastElementChild;
  const row = document.createElement("div");
  row.className = "row " + (me ? "me" : "bot");
  if (!me) {
    const mini = document.createElement("div");
    mini.className = "mini"; mini.textContent = "😎";
    // аватарка только у последнего пузыря в серии
    if (prev && prev.classList.contains("bot")) { const pm = prev.querySelector(".mini"); if (pm) pm.classList.add("hide"); }
    row.appendChild(mini);
  }
  const b = document.createElement("div");
  b.className = "msg";
  if (text !== null) {
    b.textContent = text;
    const t = document.createElement("span"); t.className = "time"; t.textContent = hhmm(ts);
    b.appendChild(t);
  }
  row.appendChild(b);
  chat.appendChild(row);
  chat.scrollTop = chat.scrollHeight;
  return row;
}

function hero(){
  const h = document.createElement("div");
  h.className = "hero";
  h.innerHTML = `<div class="big"><div class="ring"></div><div class="face">😎</div></div>
    <h1>Братан</h1>
    <p>Спрашивай чё хочешь — отвечу по делу, а заодно и подъебу. Только не ной потом 😏</p>
    <div class="grid"></div>`;
  const g = h.querySelector(".grid");
  SUGGEST.forEach(([e,t,s]) => {
    const c = document.createElement("button");
    c.className = "card"; c.type = "button";
    c.innerHTML = `<span class="e">${e}</span><b>${t}</b><small>${s}</small>`;
    c.onclick = () => send(t);
    g.appendChild(c);
  });
  chat.appendChild(h);
}

function render(){
  chat.innerHTML = "";
  if (!history.length) return hero();
  history.forEach(m => addRow(m.role, m.content, m.ts));
}

async function send(text){
  text = text.trim();
  if (!text || sendBtn.disabled) return;
  input.value = ""; autosize();
  const h = chat.querySelector(".hero"); if (h) h.remove();
  const ts = Date.now();
  history.push({ role: "user", content: text, ts });
  const mine = addRow("user", text, ts);
  save();

  sendBtn.disabled = true;
  statusEl.textContent = "печатает…"; statusEl.className = "typing";
  const typing = addRow("assistant", null);
  typing.querySelector(".msg").innerHTML = '<span class="dots3"><i></i><i></i><i></i></span>';

  try {
    const r = await fetch(WORKER_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: history.map(m => ({ role: m.role, content: m.content })) }),
    });
    const data = await r.json().catch(() => ({}));
    typing.remove();
    if (!r.ok || !data.reply) throw new Error(data.error || ("Ошибка " + r.status));
    const rts = Date.now();
    history.push({ role: "assistant", content: data.reply, ts: rts });
    addRow("assistant", data.reply, rts);
    save();
  } catch (e) {
    typing.remove(); mine.remove();
    history.pop(); save();
    if (!history.length) hero();
    const er = document.createElement("div"); er.className = "err";
    er.textContent = "⚠️ " + (e.message === "Failed to fetch" ? "Нет связи с сервером" : e.message);
    chat.appendChild(er); chat.scrollTop = chat.scrollHeight;
    setTimeout(() => er.remove(), 6000);
    input.value = text; autosize();
  } finally {
    sendBtn.disabled = false;
    statusEl.textContent = "в сети, готов стебать"; statusEl.className = "";
  }
}

function autosize(){ input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 120) + "px"; }

form.addEventListener("submit", e => { e.preventDefault(); send(input.value); });
input.addEventListener("input", autosize);
input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey && window.innerWidth > 700) { e.preventDefault(); send(input.value); }
});
document.getElementById("clear").addEventListener("click", () => {
  if (!history.length) return;
  history = []; save(); render();
});

render();
</script>
</body>
</html>
